pg(2,`<b class="egg" id="e1">${ic("star",16,"currentColor")}</b><h2>Happy Birthday, ${C.her}</h2><p class="sub">Blow into your phone’s microphone to dim the candles, or tap them.</p><div class="cakew" id="cw">${cakeS}</div><p class="msg" id="cm">Make a wish.</p><button class="btn" id="mb">${ic("mic")} Blow the candles</button>`)+

pg(4,`<h2>Your favourite animal</h2><p class="sub" id="ah">There’s one more thing you love.</p><div class="an" id="an"><div class="stk" id="stk">${ph(C.animalSticker,"Add sticker")}${[0,1,2].map(i=>ph(C.animalFrames[i],"Image "+(i+1))).join("")}</div></div><button class="btn" id="ab">${ic("wand")} Reveal your favourite animal</button>`)+
pg(5,`<h2>Our scrapbook</h2><p class="sub">Tap the edges to turn the pages.</p><div class="bkw"><div class="bk" id="bk"><div class="bc"></div></div></div><p class="hand" id="bn" style="font-size:1.3rem">Closed</p>`)+
pg(6,`<div class="ig glass"><div class="hd"><div class="av" id="av"><i></i></div><span>${C.her}</span><span style="margin-left:auto;display:flex;gap:10px">${ic("heart",20)}${ic("chat",20)}</span></div><div class="stack" id="sk2"></div><p class="hand" id="gcn" style="font-size:1.15rem;opacity:.8">Tap for the next one. Double-tap to love it.</p></div>`)+
pg(7,`<h2>A letter for you</h2><div class="env" id="env2" style="cursor:pointer"><div class="pp"></div><div class="fr"></div><div class="fp"></div><div class="sl">${ic("heart",16,"currentColor")}</div></div><p class="sub" id="lh">Tap the envelope to open it.</p><div class="lt" id="lt">${C.letter.map((p,i)=>`<p style="animation-delay:${1.2+i*1.1}s">${p}</p>`).join("")}<p style="text-align:right;animation-delay:${1.2+C.letter.length*1.1}s">With all my love,<br>${C.me}</p></div>`)+
pg(8,`<div id="fs"></div><h2 id="fh">One more thing</h2><button class="btn" id="lk">${ic("star")} Look up</button><p id="fmsg">${C.finalMsg}</p><p class="sub" id="fc" style="opacity:0"></p><button class="btn" id="rp" style="opacity:0;pointer-events:none">${ic("rep")} Replay from the start</button><div class="fls">${[0,1,2,3,4].map(i=>i%2?rose(cols[i]):tulip(cols[i])).join("")}</div>`);
/* ===== FX ===== */
const fx=$("#fx"),g=fx.getContext("2d");let W,H,fl=[],ps=[];
const rs=()=>{W=fx.width=innerWidth;H=fx.height=innerHeight};rs();addEventListener("resize",rs);
for(let i=0;i<50;i++)fl.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2+.6,v:Math.random()*.7+.3,p:Math.random()*6});
(function loop(){g.clearRect(0,0,W,H);g.fillStyle="rgba(255,255,255,.65)";for(const f of fl){f.y+=f.v;f.p+=.01;f.x+=Math.sin(f.p)*.4;if(f.y>H){f.y=-4;f.x=Math.random()*W}g.beginPath();g.arc(f.x,f.y,f.r,0,7);g.fill()}
 ps=ps.filter(p=>p.l-->0);for(const p of ps){p.vy+=.25;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;g.save();g.translate(p.x,p.y);g.rotate(p.r+=.1);g.fillStyle=p.c;g.globalAlpha=Math.min(1,p.l/30);g.fillRect(-p.s/2,-p.s/3,p.s,p.s/1.6);g.restore()}requestAnimationFrame(loop)})();
const burst=(x,y,n=90,c=["#e58aa8","#f4c6d4","#f2d3a0","#9a6a8a","#fff"])=>{for(let i=0;i<n;i++)ps.push({x,y,vx:(Math.random()-.5)*11,vy:Math.random()*-11-2,s:4+Math.random()*6,c:c[i%c.length],r:Math.random()*6,l:90+Math.random()*60})};
for(let i=0;i<12;i++){const p=document.createElement("i");p.className="pt";p.style.cssText=`left:${Math.random()*100}vw;--dx:${Math.random()*160-80}px;animation-duration:${14+Math.random()*12}s;animation-delay:-${Math.random()*20}s;transform:scale(${.6+Math.random()*.8})`;document.body.appendChild(p)}
const stars=(el,n)=>{for(let i=0;i<n;i++){const s=document.createElement("i");s.className="st";s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:-${Math.random()*3}s;transform:scale(${.5+Math.random()*1.2})`;el.appendChild(s)}};
stars($("#is"),45);stars($("#fs"),70);
/* ===== NAV ===== */
let cur=0;const nx=$("#nx");nx.innerHTML=`Continue ${ic("arr",18)}`;
function go(n){nx.classList.remove("show");$$(".pg")[cur].classList.remove("on");cur=n;$$(".pg")[n].classList.add("on");if(n==6)sk2.children[0].classList.add("top")}
function ready(n){if(cur==n&&n<8)setTimeout(()=>nx.classList.add("show"),700)}
nx.onclick=()=>go(cur+1);go(0);
$("#go").onclick=()=>{$("#env").classList.add("op");setTimeout(()=>{go(1);if(!built)build()},1500)};
/* ===== EGGS ===== */
const found=new Set();
function egg(n,h,b){found.add(n);$("#eh").textContent=h;$("#eb").textContent=b;$("#eg").classList.add("on");burst(innerWidth/2,innerHeight/2,70,["#f2d3a0","#fff","#e58aa8"])}
$("#ex").onclick=()=>$("#eg").classList.remove("on");
let t1=0;$("#e1").onclick=()=>{if(++t1==3){t1=0;egg(1,"A secret star","Out of every star in the sky, you spotted the one that was always yours.")}};
let t2=0;
/* ===== PUZZLE ===== */
let built=0,pos=[],sel=-1;
function build(){built=1;const im=new Image();im.onload=()=>puz(C.puzzleImg);im.onerror=()=>{const c=document.createElement("canvas");c.width=c.height=600;const x=c.getContext("2d"),gr=x.createLinearGradient(0,0,600,600);gr.addColorStop(0,"#f4a6bd");gr.addColorStop(.6,"#9a6a8a");gr.addColorStop(1,"#5a1130");x.fillStyle=gr;x.fillRect(0,0,600,600);x.fillStyle="rgba(255,255,255,.35)";for(let i=0;i<14;i++){x.beginPath();x.arc(Math.random()*600,Math.random()*600,30+Math.random()*60,0,7);x.fill()}x.fillStyle="#f7ebe0";x.font="italic 64px Georgia";x.textAlign="center";x.fillText("Your picture",300,290);x.fillText("goes here",300,360);puz(c.toDataURL())};im.src=C.puzzleImg||"x"}
function puz(src){const bd=$("#bd");pos=[...Array(9).keys()];do{pos.sort(()=>Math.random()-.5)}while(pos.every((p,i)=>p==i));
 pos.forEach((p,i)=>{const t=document.createElement("div");t.className="tl";t.innerHTML=`<i style="background-image:url('${src}');background-position:${i%3*50}% ${Math.floor(i/3)*50}%"></i>`;t.onclick=()=>pick(i);bd.appendChild(t)});lay()}
function lay(){$$(".tl").forEach((t,i)=>{const p=pos[i];t.style.left=`calc(6px + ${p%3} * (100% - 12px) / 3)`;t.style.top=`calc(6px + ${Math.floor(p/3)} * (100% - 12px) / 3)`;t.style.width=t.style.height="calc((100% - 12px) / 3)";t.classList.toggle("sel",i==sel)})}
function pick(i){if($("#bd").classList.contains("ok"))return;if(sel<0)sel=i;else{if(sel!=i){[pos[sel],pos[i]]=[pos[i],pos[sel]]}sel=-1}lay();if(pos.every((p,k)=>p==k)){$("#bd").classList.add("ok");$("#pm").textContent="Beautiful. You put it back together.";burst(innerWidth/2,innerHeight*.5,120);ready(1)}}
/* ===== CAKE ===== */
let lit=3;const cm=$("#cm"),cds=$$(".cd2"),fv=[1,1,1];
function out(i){const f=cds[i].querySelector(".fm");if(f.dataset.o)return;f.dataset.o=1;f.style.opacity=0;fv[i]=0;lit--;const r=f.getBoundingClientRect();burst(r.x+r.width/2,r.y,16,["#ddd","#fff"]);if(lit)cm.textContent=lit+(lit>1?" candles":" candle")+" left.";else{cm.textContent="Wish made. I hope it comes true.";setTimeout(()=>burst(innerWidth/2,innerHeight*.4,160),300);ready(2)}}
cds.forEach((c,i)=>c.onclick=e=>{e.stopPropagation();out(i)});
$("#cw").onclick=()=>{burst(innerWidth/2,innerHeight*.45,120)};
$("#mb").onclick=async e=>{e.currentTarget.style.display="none";try{const s=await navigator.mediaDevices.getUserMedia({audio:true}),ac=new(window.AudioContext||window.webkitAudioContext)(),an=ac.createAnalyser();an.fftSize=512;ac.createMediaStreamSource(s).connect(an);const d=new Uint8Array(an.fftSize);cm.textContent="Now blow gently toward your phone.";
 (function tick(){if(!lit){s.getTracks().forEach(t=>t.stop());return}an.getByteTimeDomainData(d);let m=0;for(const v of d)m+=Math.abs(v-128);m/=d.length;const i=fv.findIndex(v=>v>0);if(m>12&&i>-1){fv[i]-=Math.min(.06,(m-10)/250);const f=cds[i].querySelector(".fm");if(fv[i]<=.03){fv[i]=0;out(i)}else{f.style.opacity=fv[i];f.style.transform=`scale(${.5+fv[i]*.5}) skewX(${(Math.random()-.5)*20}deg)`}}requestAnimationFrame(tick)})()}catch(x){cm.textContent="Microphone is off. Tap each candle to blow it out."}};
/* ===== GARDEN ===== */
const seen=new Set();
$$(".fw").forEach((f,i)=>f.onclick=()=>{f.classList.remove("pop");void f.offsetWidth;f.classList.add("pop","seen");const r=f.getBoundingClientRect();burst(r.x+r.width/2,r.y+30,26,["#f4c6d4","#e58aa8","#e0527a"]);const c=$("#gm");c.style.opacity=0;setTimeout(()=>{c.textContent=f.dataset.m;c.style.opacity=1},200);seen.add(i);if(seen.size==6)ready(3)});
/* ===== ANIMAL ===== */
$("#ab").onclick=e=>{e.currentTarget.style.display="none";$("#stk").classList.add("on");$("#stk").dataset.r=1;$("#ah").textContent="A sticker just appeared. Tap it.";burst(innerWidth/2,innerHeight*.4,50,["#f2d3a0","#fff"])};
let playing=0;$("#stk").onclick=()=>{if(!$("#stk").dataset.r||playing)return;playing=1;const k=[...$("#stk").children],s=$("#stk");s.classList.remove("on");s.style.transform="rotate(-5deg) scale(1)";s.classList.add("play");let n=0;const iv=setInterval(()=>{k.forEach((c,j)=>c.style.opacity=j==1+n%3?1:0);if(n%3==0)burst(innerWidth/2,innerHeight*.4,14,["#f2d3a0","#f4c6d4"]);if(++n>9){clearInterval(iv);s.classList.remove("play");$("#ah").textContent="That’s you. Tap again to replay.";playing=0;ready(4)}},450)};
/* ===== BOOK ===== */
const B=C.bookPhotos,K=C.bookCaps,stk=[()=>flo("#e58aa8",46),()=>hts("#e0527a",40),()=>sts("#f2d3a0",38),()=>flo("#f4c6d4",44)];
const side=i=>`<div class="fc ${i?"b":""}">${ph(B[i-1],"Add photo")}<span class="cap hand">${K[i-1]}</span>${stk[i%4]()}</div>`;
const sides=[`<div class="fc cv"><div style="width:76px">${rose("#e0527a")}</div><div class="hand" style="font-size:1.7rem;line-height:1.1;text-align:center">Happy Birthday<br>${C.her}</div><div class="hand" style="font-size:1.1rem">by ${C.me}</div></div>`];
for(let i=1;i<8;i++)sides.push(side(i).replace(/class="fc (b)?"/,i%2?'class="fc b"':'class="fc"'));
const L=4;let bp=0;const bk=$("#bk");
for(let i=0;i<L;i++){const l=document.createElement("div");l.className="lf";l.style.zIndex=L-i;l.innerHTML=(i?sides[2*i-0].replace('class="fc b"','class="fc"'):sides[0])+sides[2*i+1].replace('class="fc"','class="fc b"');bk.appendChild(l)}
["zl","zr"].forEach(c=>{const z=document.createElement("i");z.className="zn "+c;bk.appendChild(z)});
function turn(d){const n=bp+d;if(n<0||n>L)return;const k=d>0?bp:n,lf=bk.children[1+k];lf.style.zIndex=L+5;lf.classList.toggle("fl2",d>0);setTimeout(()=>lf.style.zIndex=d>0?k+1:L-k,600);bp=n;bk.classList.toggle("open",bp>0&&bp<L);bk.classList.toggle("end",bp==L);$("#bn").textContent=bp==0?"Closed":bp==L?"The end":"Page "+bp;if(bp==L)ready(5)}

/* ===== GALLERY ===== */
const sk2=$("#sk2");let gi=0,lt=0;
C.gallery.forEach((g2,i)=>{const d=document.createElement("div");d.className="pc";d.style.setProperty("--r",(i%2?2.5:-2.5)+"deg");d.style.setProperty("--s",Math.max(.88,1-i*.03));d.style.zIndex=99-i;d.innerHTML=`${ph(g2[0],"Your photo here")}<p>${g2[1]}</p><svg class="hrt" viewBox="0 0 24 24"><path d="${P.heart}" fill="currentColor"/></svg>`;
 d.onclick=()=>{const now=Date.now();if(now-lt<320){const h=d.querySelector(".hrt");h.classList.remove("on");void h.offsetWidth;h.classList.add("on");lt=0;return}lt=now;setTimeout(()=>{if(lt!=now||i!=gi)return;if(gi<C.gallery.length-1){d.classList.add("gone");gi++;sk2.children[gi].classList.add("top")}else{$("#gcn").textContent="That’s all of them, for now.";ready(6)}},330)};sk2.appendChild(d)});
$("#av").onclick=()=>{if(++t2==3){t2=0;egg(2,"Look closely","In every one of these photos, I’m just the lucky one standing next to you.")}};
/* ===== MUSIC ===== */
const au=new Audio(C.audio);au.loop=true;au.preload="none";let bad=0;
const set=p=>{$("#vn").classList.toggle("on",p);$("#pp").innerHTML=ic(p?"pause":"play",18,"currentColor")};set(0);$("#mu").innerHTML=ic("vol",18);

$("#env2").onclick=()=>{if($("#env2").classList.contains("op"))return;$("#env2").classList.add("op");$("#lh").style.display="none";setTimeout(()=>{$("#env2").style.display="none";$("#lt").classList.add("on");ready(7)},1500);setTimeout(()=>ready(7),1500+C.letter.length*1100+2200)};
$("#lk").onclick=e=>{e.currentTarget.style.display="none";$("#fh").style.display="none";setTimeout(()=>{$("#fmsg").classList.add("on");burst(innerWidth/2,innerHeight*.5,130)},300);setTimeout(()=>{$("#fc").textContent="Secrets found: "+found.size+" of 3";$("#fc").style.opacity=.8;$("#rp").style.opacity=1;$("#rp").style.pointerEvents="auto"},2600)};
$("#rp").onclick=()=>location.reload();
</script></body></html>
